<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1c130e">
  <meta name="description" content="A curated launch hub for bartender-focused games and interactive training experiences.">
  <title>Bartender Games Hub | Interactive Training & Play</title>
  
  <!-- Preconnect and Google Fonts (Cinzel for premium brand display, Plus Jakarta Sans for crisp modern UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hub-wrapper">
    <!-- Header Section -->
    <header class="hub-header" role="banner">
      <div class="brand-seal-wrapper" aria-hidden="true">
        <div class="brand-seal-halo"></div>
        <div class="brand-seal">
          <!-- Stylized Jigger & Bar Spoon Crest SVG -->
          <svg class="brand-seal-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="24" cy="24" r="22" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6"/>
            <path d="M19 12H29L26 21H22L19 12Z" fill="url(#orangeGrad)" stroke="#D9A63A" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M20 27H28L31 36H17L20 27Z" fill="url(#orangeGrad)" stroke="#D9A63A" stroke-width="1.2" stroke-linejoin="round"/>
            <line x1="22" y1="21" x2="26" y2="27" stroke="#D9A63A" stroke-width="1.5"/>
            <line x1="26" y1="21" x2="22" y2="27" stroke="#D9A63A" stroke-width="1.5"/>
            <!-- Twisted Spoon Bar Accent -->
            <path d="M14 34L34 14" stroke="#FAF2EB" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
            <circle cx="13" cy="35" r="1.5" fill="#D9A63A"/>
            <path d="M34 14C35.5 12.5 37 13 36 15L34 14Z" fill="#FAF2EB"/>
            <defs>
              <linearGradient id="goldGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
                <stop stop-color="#D9A63A"/>
                <stop offset="1" stop-color="#C45B28"/>
              </linearGradient>
              <linearGradient id="orangeGrad" x1="17" y1="12" x2="31" y2="36" gradientUnits="userSpaceOnUse">
                <stop stop-color="#C45B28"/>
                <stop offset="1" stop-color="#96352A"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
      </div>

      <h1 class="brand-title">Bartender Games</h1>
      <p class="brand-tagline">Choose a game and sharpen your craft.</p>
    </header>

    <!-- Main Game Portal -->
    <main class="hub-main" id="main-content">
      <div id="game-grid" class="game-grid" role="feed" aria-busy="true" aria-label="Bartender games collection">
        <!-- Structured cards will be rendered dynamically by script.js -->
        <noscript>
          <div class="card-fallback">
            <p>Please enable JavaScript to browse and launch games from the Bartender Hub.</p>
          </div>
        </noscript>
      </div>
    </main>

    <!-- Hub Footer -->
    <footer class="hub-footer">
      <div class="footer-divider" aria-hidden="true"></div>
      <p class="footer-text">Curated training and play for hospitality professionals</p>
      <div class="footer-meta">
        <span class="hub-version">v1.0 MVP</span>
        <span class="meta-dot">•</span>
        <span id="game-count-indicator">Loading games...</span>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
