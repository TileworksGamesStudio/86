<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1c130e">
  <meta name="description" content="A curated launch hub for bartender-focused games and interactive training experiences.">
  <title>Bartender Games Hub | Interactive Training & Play</title>
  
  <!-- Preconnect and Google Fonts (Cinzel for premium brand display, Plus Jakarta Sans for crisp modern UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hub-wrapper">
    <!-- Header Section -->
    <header class="hub-header" role="banner">

      <!-- 1. CHANGE LINK HERE: Replace the URL inside href="..." -->
      <a href="https://www.instagram.com/tileworks_studio/" class="brand-seal-wrapper" aria-label="Home">
        <div class="brand-seal-halo"></div>
        <div class="brand-seal">
          <!-- 2. CHANGE IMAGE HERE: Put your image filename or image URL in src="..." -->
          <img src="logo.png" alt="Logo" class="brand-seal-img">
        </div>
      </a>

      <h1 class="brand-title">Bartender Games</h1>
      <p class="brand-tagline">Choose a game and sharpen your craft.</p>
    </header>

    <!-- Main Game Portal -->
    <main class="hub-main" id="main-content">
      <div id="game-grid" class="game-grid" role="feed" aria-busy="true" aria-label="Bartender games collection">
        <!-- Structured cards will be rendered dynamically by script.js -->
        <noscript>
          <div class="card-fallback">
            <p>Please enable JavaScript to browse and launch games from the Bartender Hub.</p>
          </div>
        </noscript>
      </div>
    </main>

    <!-- Hub Footer -->
    <footer class="hub-footer">
      <div class="footer-divider" aria-hidden="true"></div>
      <p class="footer-text">Curated training and play for hospitality professionals</p>
      <div class="footer-meta">
        <span class="hub-version">v1.0 MVP</span>
        <span class="meta-dot">•</span>
        <span id="game-count-indicator">Loading games...</span>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
